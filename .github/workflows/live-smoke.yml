name: Public live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run opt-in public internet smoke tests
        env:
          RUN_LIVE_TESTS: "1"
          RUN_TENDER_LIVE_TESTS: "1"
          OFFICIAL_SEARCH_BACKEND: ddgs
          OFFICIAL_SEARCH_REVERSE_BACKEND: ddgs
        run: uv run pytest -m live -vv
