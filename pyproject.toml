[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "official-search-mcp"
version = "0.2.0"
description = "Bidirectional tender crosscheck MCP for DeepSeek and public official sources"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp==3.14.3",
  "charset-normalizer==3.5.1",
  "ddgs==9.14.4",
  "mcp==2.0.0",
  "protego==0.6.2",
  "pydantic==2.13.4",
  "trafilatura==2.2.0",
  "yarl==1.24.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]

[project.scripts]
official-search-mcp = "official_search_mcp.server:main"
official-search-cli = "official_search_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/muchensu77-create/deepseek-tender-crosscheck-mcp"
Repository = "https://github.com/muchensu77-create/deepseek-tender-crosscheck-mcp"
Issues = "https://github.com/muchensu77-create/deepseek-tender-crosscheck-mcp/issues"
Changelog = "https://github.com/muchensu77-create/deepseek-tender-crosscheck-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/official_search_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: performs real public-internet requests (disabled unless explicitly selected)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]
